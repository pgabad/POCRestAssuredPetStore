name: CI/CD Pipeline (GitHub Actions)

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'
      - 'bugfix/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - master
      - 'feature/*'
      - 'bugfix/*'
      - 'hotfix/*'

jobs:
  lint:
    name: Lint OpenAPI Contract (Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Spectral Linter
        run: npx @stoplight/spectral-cli lint contratoPetStore.yaml -f text -o reports/spectral-errors.txt
        continue-on-error: true # Permite continuar para que los tests se ejecuten aunque existan advertencias de diseño de API

      - name: Upload Spectral Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-lint-report-${{ github.ref_name }}
          path: reports/spectral-errors.txt
          retention-days: 14

  test:
    name: Execute Tests & Generate Reports
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create Dummy .env File
        run: |
          if [ ! -f .env ]; then
            echo "BASE_URL=https://petstore.swagger.io/v2" > .env
          fi
        # Evita que el cargador Dotenv falle si el archivo no existe en el entorno CI

      - name: Run Maven Tests
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -B

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.ref_name }}
          path: target/allure-results/
          retention-days: 14

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.ref_name }}
          path: target/allure-report/
          retention-days: 14
